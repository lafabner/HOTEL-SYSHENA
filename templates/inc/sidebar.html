<aside class="sidebar" id="sidebar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-label="Logo SysHSENA"><path d="M6 30c7-10 13-15 20-15 6 0 10 3 16 9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M7 36c7-6 13-9 20-9 6 0 10 2 14 5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="10" r="4" fill="currentColor"/></svg>
    <div><div class="brand-name">SysHSENA</div><small>Guajira Serena</small></div>
  </div>
  {% for seccion, items in menu_secciones.items %}
    <div class="nav-section">{{ seccion }}</div>
    <nav class="side-nav" aria-label="{{ seccion }}">
      {% for item in items %}
        <a class="nav-link-app{% if item.activo %} active{% endif %}" href="{{ item.href }}"{% if item.activo %} aria-current="page"{% endif %}><span class="nav-ico" aria-hidden="true">{{ item.icono }}</span><span>{{ item.nombre }}</span></a>
      {% endfor %}
    </nav>
  {% endfor %}
  <div class="sidebar-footer">
    <div class="avatar">{{ usuario_iniciales }}</div>
    <div><strong>{{ usuario_nombre }}</strong><small>{{ usuario_rol }}</small></div>
  </div>
</aside>
